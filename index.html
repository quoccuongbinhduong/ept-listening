<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>EPT Practice</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
:root{--bg:#0d0f1a;--surf:#151828;--surf2:#1e2235;--bdr:#2a2f4a;
  --acc:#6c63ff;--acc2:#a78bfa;--grn:#22c55e;--red:#ef4444;--yel:#facc15;
  --txt:#e2e8f0;--mut:#8892a4;--r:14px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;}
body::before{content:'';position:fixed;inset:0;z-index:-1;
  background:radial-gradient(ellipse 70% 50% at 20% 20%,rgba(108,99,255,.15),transparent 60%),
             radial-gradient(ellipse 60% 70% at 80% 80%,rgba(167,139,250,.1),transparent 60%);}

.menu-box {
  background: var(--surf);
  padding: 40px;
  border-radius: 20px;
  border: 1px solid var(--bdr);
  text-align: center;
  max-width: 500px;
  width: 90%;
  box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  animation: fadeUp 0.5s ease;
}

.logo {
  width: 60px; height: 60px;
  background: linear-gradient(135deg, var(--acc), var(--acc2));
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: bold;
  margin: 0 auto 15px;
}

h1 { font-size: 24px; margin-bottom: 5px; background: linear-gradient(135deg, #fff, var(--acc2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
p { color: var(--mut); font-size: 14px; margin-bottom: 30px; }

.menu-options {
  display: flex; flex-direction: column; gap: 15px;
}

.btn-option {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px;
  background: var(--surf2);
  border: 1px solid var(--bdr);
  border-radius: 12px;
  color: var(--txt);
  text-decoration: none;
  font-weight: 600;
  transition: all 0.2s;
}

.btn-option:hover {
  border-color: var(--acc);
  background: rgba(108,99,255,0.1);
  transform: translateY(-2px);
}

.btn-option.reading {
  background: linear-gradient(135deg, rgba(167,139,250,0.1), rgba(108,99,255,0.1));
}

.login-input-group input {
  width: 100%; padding: 14px; border-radius: 8px; border: 1px solid var(--bdr);
  background: var(--bg); color: var(--txt); margin-bottom: 15px;
}
.login-input-group button {
  width: 100%; padding: 14px; border-radius: 8px; border: none;
  background: var(--acc); color: #fff; font-weight: bold; cursor: pointer;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
  </style>
</head>
<body>
  <div class="menu-box">
    <div class="logo">E</div>
    <h1>EPT Practice Tests</h1>
    <p>Practice Tests</p>
    
    <div id="login-section">
      <div class="login-input-group">
        <input type="text" id="login-user" placeholder="Mã số sinh viên (VD: 2418480104001)" onkeypress="if(event.key === 'Enter') doLogin()">
        <button onclick="doLogin()">Đăng nhập</button>
        <p id="login-error" style="color:var(--red); font-size:12px; margin-top:10px; display:none;"></p>
      </div>
    </div>

    <div id="menu-section" class="menu-options" style="display:none;">
      <a href="listening.html" class="btn-option">
        <span>🎧 Luyện thi Nghe (Listening)</span>
        <span>→</span>
      </a>
      <a href="reading.html" class="btn-option reading">
        <span>📖 Luyện thi Đọc hiểu (Reading)</span>
        <span>→</span>
      </a>
      <button onclick="logout()" style="margin-top:10px; padding:10px; background:var(--surf2); border:1px solid var(--bdr); color:var(--mut); border-radius:8px; cursor:pointer;">Đăng xuất</button>
    </div>
  </div>

  <script>
    function checkAuth() {
      if(localStorage.getItem('ept_auth')) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('menu-section').style.display = 'flex';
      } else {
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('menu-section').style.display = 'none';
      }
    }

    const TRACKING_URL = 'https://script.google.com/macros/s/AKfycbxv0rRHB-ApxCS75MK_lElRobTPWLDXhOXlOcby6235i3zlTTMC-S892jLiWHLcb74v-w/exec';

    function trackUser(mssv, action, details) {
      if(!mssv) return;
      try {
        const url = `${TRACKING_URL}?mssv=${encodeURIComponent(mssv)}&action=${encodeURIComponent(action)}&details=${encodeURIComponent(details)}`;
        fetch(url, { method: "GET", mode: "no-cors" }).catch(e => console.log(e));
      } catch(e) {}
    }

    function doLogin() {
      const u = document.getElementById('login-user').value.trim();
      if(!u) {
        document.getElementById('login-error').innerText = 'Vui lòng nhập MSSV';
        document.getElementById('login-error').style.display = 'block';
        return;
      }
      localStorage.setItem('ept_auth', u);
      trackUser(u, "Đăng nhập", "Truy cập trang chủ");
      checkAuth();
    }

    function logout() {
      localStorage.removeItem('ept_auth');
      checkAuth();
    }

    checkAuth();
  </script>
</body>
</html>
