<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>EPT Reading Practice – TDMU</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
:root{--bg:#0d0f1a;--surf:#151828;--surf2:#1e2235;--bdr:#2a2f4a;
  --acc:#6c63ff;--acc2:#a78bfa;--grn:#22c55e;--red:#ef4444;--yel:#facc15;
  --txt:#e2e8f0;--mut:#8892a4;--r:14px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;display:flex;flex-direction:column;}

header{background:rgba(21,24,40,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--bdr);
  padding:11px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.logo-area { display: flex; align-items: center; gap: 11px; cursor: pointer; text-decoration: none; color: inherit; }
.logo{width:36px;height:36px;background:linear-gradient(135deg,var(--acc),var(--acc2));
  border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;font-weight:bold;}
.logo-t h1{font-size:14px;font-weight:700;}.logo-t p{font-size:10px;color:var(--mut);}

.main-content { display: flex; flex: 1; overflow: hidden; }

/* Left Pane: PDF Viewer */
.pdf-pane { flex: 2; border-right: 1px solid var(--bdr); background: #fff; }
.pdf-pane iframe { width: 100%; height: 100%; border: none; }

/* Right Pane: Bubble Sheet */
.sheet-pane { flex: 1; min-width: 320px; max-width: 450px; background: var(--surf); display: flex; flex-direction: column; }
.sheet-header { padding: 15px; border-bottom: 1px solid var(--bdr); }
.sheet-header select { width: 100%; padding: 10px; border-radius: 8px; background: var(--surf2); color: white; border: 1px solid var(--bdr); font-family: 'Inter', sans-serif; font-size: 14px; margin-top: 10px; }

.sheet-scroll { flex: 1; overflow-y: auto; padding: 15px; }

.q-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; background: var(--surf2); padding: 10px; border-radius: 8px; border: 1px solid var(--bdr); }
.q-num { font-weight: 600; width: 40px; color: var(--mut); }
.q-opts { display: flex; gap: 8px; }
.q-opt { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--bdr); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; background: rgba(255,255,255,0.05); }
.q-opt:hover { border-color: var(--acc); }
.q-opt.sel { background: var(--acc); border-color: var(--acc); color: white; }
.q-opt.ok { background: var(--grn); border-color: var(--grn); color: white; }
.q-opt.no { background: var(--red); border-color: var(--red); color: white; }

.exp-box { background: rgba(108,99,255,.1); border: 1px solid var(--acc); padding: 10px; border-radius: 8px; margin-top: 5px; margin-bottom: 15px; font-size: 12px; display: none; line-height: 1.5; }
.exp-box.show { display: block; }
.exp-box .trans { font-style: italic; color: var(--mut); margin-bottom: 4px; }

.sheet-footer { padding: 15px; border-top: 1px solid var(--bdr); background: var(--surf); }
.btn-submit { width: 100%; padding: 14px; border-radius: 10px; border: none; background: linear-gradient(135deg, var(--acc), var(--acc2)); color: white; font-weight: 700; font-size: 15px; cursor: pointer; transition: opacity 0.2s; }
.btn-submit:hover { opacity: 0.9; }

/* Login Overlay Styles */
#login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 9999; }
.login-box { background: var(--surf); padding: 30px; border-radius: 16px; border: 1px solid var(--bdr); width: 100%; max-width: 340px; text-align: center; }
.login-box h2 { margin-bottom: 20px; color: #fff; }
.login-box input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--bdr); background: var(--surf2); color: white; }
.login-box button { width: 100%; padding: 12px; background: var(--acc); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
.hidden { display: none !important; }

::-webkit-scrollbar{width:6px;}::-webkit-scrollbar-track{background:var(--surf);}
::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px;}
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo-area">
      <div class="logo">E</div>
      <div class="logo-t">
        <h1>EPT Reading</h1>
        <p>Thủ Dầu Một University</p>
      </div>
    </a>
    <div style="font-size:12px; color:var(--mut);">
      Xin chào, <span id="user-display" style="color:var(--acc2);font-weight:bold;">Guest</span>
    </div>
  </header>

  <div class="main-content">
    <div class="pdf-pane">
      <iframe id="pdf-viewer" src=""></iframe>
    </div>
    <div class="sheet-pane">
      <div class="sheet-header">
        <h3 style="font-size: 16px;">Phiếu làm bài (Answer Sheet)</h3>
        <select id="test-select" onchange="changeTest(this.value)">
          <option value="1">Practice Test 1</option>
          <option value="2">Practice Test 2</option>
          <option value="3">Practice Test 3</option>
          <option value="4">Practice Test 4</option>
          <option value="5">Practice Test 5</option>
        </select>
      </div>
      <div class="sheet-scroll" id="bubble-sheet">
        <!-- Bubbles injected here -->
      </div>
      <div class="sheet-footer">
        <button id="submit-btn" class="btn-submit" onclick="submitTest()">Nộp bài</button>
      </div>
    </div>
  </div>

  <script>
    let userToken = null;
    let fullData = null;
    let currentTest = "1";
    let userAnswers = {};
    let isSubmitted = false;

    async function checkAuth() {
      const stored = localStorage.getItem('ept_auth');
      if (stored) {
        userToken = stored;
        document.getElementById('user-display').innerText = userToken;
        loadData();
      } else {
        window.location.href = 'index.html';
      }
    }

    async function loadData() {
      try {
        const res = await fetch('reading_data.json?t=' + Date.now());
        fullData = await res.json();
        changeTest("1");
      } catch(e) {
        console.error("Error loading reading data", e);
      }
    }

    function changeTest(testId) {
      if (!fullData || !fullData[testId]) return;
      currentTest = testId;
      isSubmitted = false;
      userAnswers = {};
      
      const testInfo = fullData[testId];
      
      // Update PDF Viewer
      document.getElementById('pdf-viewer').src = `${testInfo.file}#toolbar=0&navpanes=0&scrollbar=1`;
      
      // Render Bubble Sheet (101 to 200)
      const container = document.getElementById('bubble-sheet');
      container.innerHTML = '';
      
      // We assume 100 questions from 101 to 200
      for(let qnum=101; qnum<=200; qnum++) {
        const qnumStr = qnum.toString();
        // Skip if this test doesn't have an answer for this question in the DB (just a safety check)
        if (!testInfo.answers[qnumStr]) continue;
        
        let rowHtml = `<div class="q-row" id="row-${qnumStr}">
          <div class="q-num">${qnumStr}.</div>
          <div class="q-opts">`;
          
        ['A','B','C','D'].forEach(letter => {
          rowHtml += `<div class="q-opt" id="opt-${qnumStr}-${letter}" onclick="selectOption('${qnumStr}', '${letter}')">${letter}</div>`;
        });
        
        rowHtml += `</div></div>`;
        
        // Add explanation box if it exists
        const exp = testInfo.explanations && testInfo.explanations[qnumStr];
        const trans = testInfo.translations && testInfo.translations[qnumStr];
        
        let expHtml = '';
        if (exp || trans) {
          expHtml += `<div class="exp-box" id="exp-${qnumStr}">`;
          if (trans) expHtml += `<div class="trans"><b>Dịch:</b> ${trans}</div>`;
          if (exp) expHtml += `<div><b>Giải thích:</b> ${exp}</div>`;
          expHtml += `</div>`;
        }
        
        container.insertAdjacentHTML('beforeend', rowHtml + expHtml);
      }
      
      document.getElementById('submit-btn').classList.remove('hidden');
    }

    function selectOption(qnum, letter) {
      if (isSubmitted) return;
      userAnswers[qnum] = letter;
      
      ['A','B','C','D'].forEach(l => {
        const el = document.getElementById(`opt-${qnum}-${l}`);
        if(el) el.classList.remove('sel');
      });
      document.getElementById(`opt-${qnum}-${letter}`).classList.add('sel');
    }

    async function submitTest() {
      if (!confirm("Bạn có chắc chắn muốn nộp bài?")) return;
      isSubmitted = true;
      document.getElementById('submit-btn').classList.add('hidden');

      const testInfo = fullData[currentTest];
      let score = 0;
      let total = 0;
      
      Object.keys(testInfo.answers).forEach(qnum => {
        total++;
        const correct = testInfo.answers[qnum];
        const userAns = userAnswers[qnum];
        
        if (userAns) {
          if (userAns === correct) {
            document.getElementById(`opt-${qnum}-${userAns}`).classList.add('ok');
            score++;
          } else {
            document.getElementById(`opt-${qnum}-${userAns}`).classList.add('no');
            document.getElementById(`opt-${qnum}-${correct}`).classList.add('ok');
          }
        } else {
          document.getElementById(`opt-${qnum}-${correct}`).classList.add('ok');
        }

        // Show explanation if exists
        const expEl = document.getElementById(`exp-${qnum}`);
        if (expEl) expEl.classList.add('show');
      });

      alert(`Bạn đã làm đúng ${score}/${total} câu!`);
      
      // Save progress
      if (userToken) {
        /*
        fetch('/api/sync', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            user: userToken,
            app: 'reading_' + currentTest,
            state: { score, total, answers: userAnswers, timestamp: Date.now() }
          })
        });
        */
      }
    }

    checkAuth();
  </script>
</body>
</html>
